aid: genopets
name: Genopets
description: >-
  Genopets is a free-to-play, move-to-earn NFT game built on the Solana
  blockchain that gamifies an active lifestyle. Players nurture a digital pet — a
  Genopet — that evolves from real-world physical activity tracked via step
  counting, then battle, craft, stake, and trade in-game NFTs and Habitats. The
  economy pairs the GENE governance token with the in-game KI utility token
  earned by moving. Genopets is developed by a studio backed by Pantera Capital
  and operates a consumer mobile/web game rather than a public developer API; no
  OpenAPI, SDK, or developer portal was found during enrichment.
